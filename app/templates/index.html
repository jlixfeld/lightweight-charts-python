<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Lightweight Charts Demo</title>
    <style>
        body {
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #11161c;
            color: #f5f5f5;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            padding: 24px;
            background: #1a212b;
            text-align: center;
        }
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        a.button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            background: linear-gradient(135deg, #2f80ed, #56ccf2);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            letter-spacing: 0.05em;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        a.button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(47, 128, 237, 0.25);
        }
    </style>
</head>
<body>
    <header>
        <h1>Lightweight Charts Python Demo</h1>
        <p style="margin-top: 8px; color: #9aa5b1;">Serve and explore OHLC datasets backed by PostgreSQL.</p>
    </header>
    <main>
        <a class="button" href="{{ url_for('chart_page') }}">Open Chart</a>
    </main>
</body>
</html>
