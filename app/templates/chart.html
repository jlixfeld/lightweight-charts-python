<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Lightweight Charts Demo</title>
    <style>
        body {
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #11161c;
            color: #f5f5f5;
        }
        header {
            padding: 16px;
            background: #1a212b;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        h1 {
            font-size: 18px;
            font-weight: 600;
            margin: 0;
        }
        label {
            font-size: 13px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #9aa5b1;
        }
        select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #2d3746;
            background: #1e2530;
            color: #f5f5f5;
            min-width: 140px;
        }
        #chart {
            width: 100vw;
            height: calc(100vh - 90px);
        }
        .notice {
            padding: 24px;
            text-align: center;
            color: #9aa5b1;
        }
    </style>
    <script>
        window.__LWC_STATE__ = {{ state | tojson }};
    </script>
    <script src="https://unpkg.com/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js"></script>
    <script defer src="{{ request.url_for('static', path='chart.js') }}"></script>
</head>
<body>
    <header>
        <h1>Lightweight Charts</h1>
        <div id="error-banner" class="notice" style="display: none; flex: 1; text-align: left; color: #f9a8d4;"></div>
        <label>
            Symbol
            <select id="symbol-select"></select>
        </label>
        <label id="timeframe-wrapper">
            Timeframe
            <select id="timeframe-select"></select>
        </label>
        <label>
            Bar Patterns
            <div style="display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="pattern-toggle" checked style="margin: 0;">
                <span style="font-size: 11px;">Highlight Inside/Outside Bars</span>
            </div>
        </label>
    </header>
    <div id="chart"></div>
    <div id="empty" class="notice" style="display:none;">No data for the selected inputs.</div>
</body>
</html>
