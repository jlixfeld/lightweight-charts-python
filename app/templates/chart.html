<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Lightweight Charts Demo</title>
        <style>
            body {
                margin: 0;
                font-family:
                    'Inter',
                    -apple-system,
                    BlinkMacSystemFont,
                    'Segoe UI',
                    sans-serif;
                background-color: #11161c;
                color: #f5f5f5;
            }
            header {
                padding: 16px;
                background: #1a212b;
                display: flex;
                align-items: center;
                gap: 16px;
                flex-wrap: wrap;
            }
            h1 {
                font-size: 18px;
                font-weight: 600;
                margin: 0;
            }
            label {
                font-size: 13px;
                display: flex;
                flex-direction: column;
                gap: 4px;
                text-transform: uppercase;
                letter-spacing: 0.08em;
                color: #9aa5b1;
            }
            select {
                padding: 8px 12px;
                border-radius: 6px;
                border: 1px solid #2d3746;
                background: #1e2530;
                color: #f5f5f5;
                min-width: 140px;
                cursor: pointer;
                transition: all 0.2s ease;
            }
            select:hover {
                border-color: #4a5568;
                background: #2a3441;
            }
            select:focus {
                outline: none;
                border-color: #3182ce;
                box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.1);
            }
            .symbol-picker {
                position: relative;
                min-width: 140px;
            }
            .symbol-input {
                width: 100%;
                padding: 8px 12px;
                border-radius: 6px;
                border: 1px solid #2d3746;
                background: #1e2530;
                color: #f5f5f5;
                cursor: pointer;
                transition: all 0.2s ease;
                box-sizing: border-box;
            }
            .symbol-input:hover {
                border-color: #4a5568;
                background: #2a3441;
            }
            .symbol-input:focus {
                outline: none;
                border-color: #3182ce;
                box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.1);
                cursor: text;
            }
            .symbol-dropdown {
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: #1e2530;
                border: 1px solid #2d3746;
                border-top: none;
                border-radius: 0 0 6px 6px;
                max-height: 200px;
                overflow-y: auto;
                z-index: 1000;
                display: none;
            }
            .symbol-dropdown.show {
                display: block;
            }
            .symbol-list {
                padding: 0;
            }
            .symbol-item {
                padding: 8px 12px;
                cursor: pointer;
                color: #f5f5f5;
                border-bottom: 1px solid #2d3746;
                transition: background-color 0.15s ease;
            }
            .symbol-item:last-child {
                border-bottom: none;
            }
            .symbol-item:hover,
            .symbol-item.highlighted {
                background: #2a3441;
            }
            .symbol-item.selected {
                background: #3182ce;
            }
            .symbol-match {
                font-weight: 600;
                color: #3182ce;
            }
            #chart {
                width: 100vw;
                height: calc(100vh - 90px);
            }
            .notice {
                padding: 24px;
                text-align: center;
                color: #9aa5b1;
            }
        </style>
        <script type="text/javascript">
            window.__LWC_STATE__ = {{ state | tojson | safe }};
        </script>
        <script src="https://unpkg.com/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js"></script>
        <script defer src="{{ request.url_for('static', path='chart.js') }}"></script>
    </head>
    <body>
        <header>
            <h1>Lightweight Charts</h1>
            <div
                id="error-banner"
                class="notice"
                style="display: none; flex: 1; text-align: left; color: #f9a8d4"
            ></div>
            <label>
                Symbol
                <div class="symbol-picker" id="symbol-picker">
                    <input
                        type="text"
                        id="symbol-input"
                        class="symbol-input"
                        placeholder="Search symbols..."
                        readonly
                    />
                    <div class="symbol-dropdown" id="symbol-dropdown">
                        <div class="symbol-list" id="symbol-list"></div>
                    </div>
                </div>
            </label>
            <label id="timeframe-wrapper">
                Timeframe
                <select id="timeframe-select"></select>
            </label>
        </header>
        <div id="chart"></div>
        <div id="empty" class="notice" style="display: none">No data for the selected inputs.</div>
    </body>
</html>
