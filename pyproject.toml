[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lightweight-charts-demo"
version = "0.1.0"
description = "FastAPI service for TradingView-style OHLC charts"
authors = [{name = "Demo Author", email = "demo@example.com"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.116.2",
    "uvicorn[standard]==0.35.0",
    "sqlalchemy==2.0.43",
    "psycopg2-binary==2.9.10",
    "pandas==2.3.2",
    "python-dotenv==1.1.1",
    "pydantic-settings==2.10.1",
    "jinja2==3.1.6"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project.optional-dependencies]
dev = [
    # Linting and formatting
    "ruff>=0.13.0",
    "pyright>=1.1.405",

    # Pre-commit hooks
    "pre-commit>=4.3.0",

    # Testing
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",  # For testing FastAPI

    # Development tools
    "invoke>=2.2.0",
    "watchdog>=4.0.0",

    # Type stubs
    "types-requests>=2.32.0",
    "pandas-stubs>=2.0.0"
]

# Ruff configuration
[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "W",  # pycodestyle warnings
    "B",  # flake8-bugbear
    "I",  # isort
    "N",  # pep8-naming
    "UP", # pyupgrade
    "C4", # flake8-comprehensions
    "S",  # bandit security
    "T20", # flake8-print
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "S101",  # use of assert
    "T201",  # print statements (for debugging)
    "S608",  # hardcoded SQL (expected in this app)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"


# Pyright configuration
[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
reportPrivateUsage = false
reportUnusedImport = false
reportUnusedClass = false
reportUnusedFunction = false
reportUnusedVariable = false
reportUntypedFunctionDecorator = false
reportIncompatibleMethodOverride = false
reportIncompatibleVariableOverride = false
reportOverlappingOverload = false
reportUninitializedInstanceVariable = false
reportArgumentType = false
reportAttributeAccessIssue = false

# Pytest configuration
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# Coverage configuration
[tool.coverage.run]
source = ["app"]
omit = [
    "tests/*",
    "*/tests/*",
    "*/__pycache__/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# Bandit security configuration
[tool.bandit]
exclude_dirs = ["tests", ".venv", "build"]
skips = ["B101"]  # Skip assert_used test
